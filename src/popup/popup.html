<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirect Blocker</title>
  <link rel="stylesheet" href="popup.css">
  <!-- Loaded before the body so the stored/OS theme is applied before first paint. -->
  <script src="theme.js"></script>
</head>

<body class="is-loading">
  <div class="container">
    <header class="header">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </span>
        <h1>Redirect Blocker</h1>
      </div>
      <button class="btn btn-icon" id="themeToggle" type="button" aria-label="Theme: follow system">
        <svg class="icon-theme-system" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="13" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
        <svg class="icon-theme-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon-theme-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </header>

    <main class="main">
      <!-- Error state: shown when the service worker cannot be reached -->
      <div class="banner" id="errorBanner" role="alert" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v4M12 16h.01" />
        </svg>
        <span id="errorBannerMessage">Could not load extension data.</span>
        <button class="btn btn-secondary btn-sm" id="errorRetry" type="button">Retry</button>
      </div>

      <!-- Mode Selection -->
      <section class="section mode-section">
        <fieldset class="fieldset">
          <legend class="section-title">Protection mode</legend>
          <div class="mode-options">
            <label class="mode-option">
              <input type="radio" name="mode" value="off">
              <span class="mode-label">
                <span class="mode-title">Off</span>
                <span class="mode-desc">Completely disabled</span>
              </span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="specific" checked>
              <span class="mode-label">
                <span class="mode-title">Specific sites</span>
                <span class="mode-desc">Enable per site below</span>
              </span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="global">
              <span class="mode-label">
                <span class="mode-title">Global</span>
                <span class="mode-desc">All sites protected</span>
              </span>
            </label>
          </div>
        </fieldset>
      </section>

      <!-- Current Site Section (only for 'specific' mode) -->
      <section class="section site-section" id="siteSection">
        <h2 class="section-title">Current site</h2>
        <div class="site-info">
          <span class="site-hostname" id="siteHostname">Loading&hellip;</span>
          <label class="toggle">
            <input type="checkbox" id="siteToggle" role="switch" aria-label="Protect the current site"
              aria-describedby="siteStatus">
            <span class="slider" aria-hidden="true"></span>
          </label>
        </div>
        <p class="site-status" id="siteStatus" aria-live="polite">Not protected</p>
      </section>

      <!-- Statistics Section -->
      <section class="section stats-section">
        <h2 class="section-title">Statistics</h2>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="totalBlocked">&mdash;</span>
            <span class="stat-label">Attempts blocked</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="sitesProtected">&mdash;</span>
            <span class="stat-label">Sites affected</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <button class="btn btn-secondary btn-block" id="resetStats" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7" />
          <path d="M3 4v5h5" />
        </svg>
        <span id="resetStatsLabel">Reset statistics</span>
      </button>

      <!-- Toast notification for feedback (floats above the footer) -->
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>

</html>
